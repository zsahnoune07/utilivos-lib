<!doctype html>
<html lang="en" data-i18n-document-title="page.meta.title">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title></title>
    <link rel="stylesheet" href="./utilivos/base.css" />
    <link rel="stylesheet" href="./utilivos/layout.css" />
    <link rel="stylesheet" href="./utilivos/components.css" />
    <link rel="stylesheet" href="./utilivos/patterns.css" />
    <link rel="stylesheet" href="./utilivos/utilities.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="uv-tool-page f4-page">
    <header class="f4-topbar">
      <div class="f4-topbar__inner">
        <div class="f4-topbar__copy">
          <h1 class="uv-tool-page__title" data-i18n="page.title"></h1>
          <p class="uv-tool-page__subtitle" data-i18n="page.subtitle"></p>
        </div>
      </div>
    </header>

    <main class="uv-tool-page__content f4-shell">
      <section class="uv-card uv-section f4-hero" aria-labelledby="overview-heading">
        <div class="f4-section-head">
          <h2 id="overview-heading" class="uv-section__title" data-i18n="overview.title"></h2>
          <p class="uv-section__description" data-i18n="overview.description"></p>
        </div>

        <ul class="f4-overview-list">
          <li data-i18n="overview.points.formula"></li>
          <li data-i18n="overview.points.risk"></li>
          <li data-i18n="overview.points.context"></li>
        </ul>
      </section>

      <section class="uv-card uv-section f4-card" aria-labelledby="inputs-heading">
        <div class="f4-section-head">
          <h2 id="inputs-heading" class="uv-section__title" data-i18n="form.section.title"></h2>
          <p class="uv-section__description" data-i18n="form.section.description"></p>
        </div>

        <form id="calculatorForm" class="f4-form" novalidate>
          <div class="f4-grid">
            <label for="age" class="uv-field f4-field">
              <span class="uv-field__label" data-i18n="form.fields.age.label"></span>
              <div id="ageShell" class="f4-input-shell">
                <input
                  id="age"
                  name="age"
                  class="uv-input f4-input"
                  type="number"
                  inputmode="numeric"
                  step="1"
                  min="18"
                  max="120"
                  autocomplete="off"
                  data-i18n-placeholder="form.fields.age.placeholder"
                  aria-describedby="ageHelp ageError"
                />
                <span class="f4-input-unit" data-i18n="form.fields.age.unit"></span>
              </div>
              <span id="ageHelp" class="uv-field__help" data-i18n="form.fields.age.help"></span>
              <span id="ageError" class="f4-error" aria-live="polite"></span>
            </label>

            <label for="ast" class="uv-field f4-field">
              <span class="uv-field__label" data-i18n="form.fields.ast.label"></span>
              <div id="astShell" class="f4-input-shell">
                <input
                  id="ast"
                  name="ast"
                  class="uv-input f4-input"
                  type="number"
                  inputmode="decimal"
                  step="0.1"
                  min="0.1"
                  max="2000"
                  autocomplete="off"
                  data-i18n-placeholder="form.fields.ast.placeholder"
                  aria-describedby="astHelp astError"
                />
                <span class="f4-input-unit" data-i18n="form.fields.ast.unit"></span>
              </div>
              <span id="astHelp" class="uv-field__help" data-i18n="form.fields.ast.help"></span>
              <span id="astError" class="f4-error" aria-live="polite"></span>
            </label>

            <label for="alt" class="uv-field f4-field">
              <span class="uv-field__label" data-i18n="form.fields.alt.label"></span>
              <div id="altShell" class="f4-input-shell">
                <input
                  id="alt"
                  name="alt"
                  class="uv-input f4-input"
                  type="number"
                  inputmode="decimal"
                  step="0.1"
                  min="0.1"
                  max="2000"
                  autocomplete="off"
                  data-i18n-placeholder="form.fields.alt.placeholder"
                  aria-describedby="altHelp altError"
                />
                <span class="f4-input-unit" data-i18n="form.fields.alt.unit"></span>
              </div>
              <span id="altHelp" class="uv-field__help" data-i18n="form.fields.alt.help"></span>
              <span id="altError" class="f4-error" aria-live="polite"></span>
            </label>

            <label for="platelets" class="uv-field f4-field">
              <span class="uv-field__label" data-i18n="form.fields.platelets.label"></span>
              <div id="plateletsShell" class="f4-input-shell">
                <input
                  id="platelets"
                  name="platelets"
                  class="uv-input f4-input"
                  type="number"
                  inputmode="decimal"
                  step="0.1"
                  min="1"
                  max="1000"
                  autocomplete="off"
                  data-i18n-placeholder="form.fields.platelets.placeholder"
                  aria-describedby="plateletsHelp plateletsError"
                />
                <span class="f4-input-unit" data-i18n="form.fields.platelets.unit"></span>
              </div>
              <span
                id="plateletsHelp"
                class="uv-field__help"
                data-i18n="form.fields.platelets.help"
              ></span>
              <span id="plateletsError" class="f4-error" aria-live="polite"></span>
            </label>
          </div>

          <p id="formStatus" class="f4-status" role="status" aria-live="polite"></p>

          <div class="uv-cluster f4-actions">
            <button
              id="calculateButton"
              class="uv-button"
              type="submit"
              disabled
              data-i18n="form.actions.calculate"
            ></button>
            <button
              id="resetButton"
              class="uv-button uv-button--secondary"
              type="button"
              data-i18n="form.actions.reset"
            ></button>
          </div>
        </form>
      </section>

      <section
        id="resultCard"
        class="uv-card uv-section f4-card f4-result f4-result--empty"
        aria-labelledby="result-heading"
      >
        <div class="f4-section-head">
          <h2 id="result-heading" class="uv-section__title" data-i18n="result.section.title"></h2>
          <p class="uv-section__description" data-i18n="result.section.description"></p>
        </div>

        <div class="f4-result__body" role="status" aria-live="polite" aria-atomic="true">
          <span id="resultBadge" class="f4-result__badge"></span>
          <p id="resultScore" class="f4-result__score"></p>
          <p id="resultCategory" class="f4-result__category"></p>
          <p id="resultInterpretation" class="f4-result__interpretation"></p>

          <dl class="f4-metrics">
            <div class="f4-metric">
              <dt class="f4-metric__label" data-i18n="result.metrics.sqrtAlt.label"></dt>
              <dd id="sqrtAltValue" class="f4-metric__value"></dd>
            </div>
            <div class="f4-metric">
              <dt class="f4-metric__label" data-i18n="result.metrics.threshold.label"></dt>
              <dd id="thresholdValue" class="f4-metric__value"></dd>
            </div>
          </dl>
        </div>
      </section>

      <details class="uv-card f4-details">
        <summary class="f4-details__summary" data-i18n="details.how.title"></summary>
        <div class="f4-details__body">
          <p class="uv-section__description" data-i18n="details.how.description"></p>
          <p class="f4-formula" data-i18n="details.how.formula"></p>
          <dl class="f4-definition-list">
            <div class="f4-definition">
              <dt data-i18n="details.how.variables.age.label"></dt>
              <dd data-i18n="details.how.variables.age.value"></dd>
            </div>
            <div class="f4-definition">
              <dt data-i18n="details.how.variables.ast.label"></dt>
              <dd data-i18n="details.how.variables.ast.value"></dd>
            </div>
            <div class="f4-definition">
              <dt data-i18n="details.how.variables.alt.label"></dt>
              <dd data-i18n="details.how.variables.alt.value"></dd>
            </div>
            <div class="f4-definition">
              <dt data-i18n="details.how.variables.platelets.label"></dt>
              <dd data-i18n="details.how.variables.platelets.value"></dd>
            </div>
          </dl>
        </div>
      </details>

      <details class="uv-card f4-details">
        <summary class="f4-details__summary" data-i18n="details.notes.title"></summary>
        <div class="f4-details__body">
          <ul class="f4-note-list">
            <li data-i18n="details.notes.items.context"></li>
            <li data-i18n="details.notes.items.cutoffs"></li>
            <li data-i18n="details.notes.items.diagnosis"></li>
          </ul>
        </div>
      </details>

      <section class="uv-card uv-section f4-card" aria-labelledby="references-heading">
        <div class="f4-section-head">
          <h2
            id="references-heading"
            class="uv-section__title"
            data-i18n="references.section.title"
          ></h2>
          <p class="uv-section__description" data-i18n="references.section.description"></p>
        </div>

        <ul class="f4-reference-list">
          <li data-i18n="references.items.sterling"></li>
          <li data-i18n="references.items.mdcalc"></li>
        </ul>
      </section>
    </main>

    <footer class="f4-footer">
      <p class="f4-footer__copy" data-i18n="footer.disclaimer"></p>
    </footer>

    <script src="./utilivos/tool.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
